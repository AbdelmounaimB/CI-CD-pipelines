name: IaC Security Scanning (Checkov + Trivy config)

# Infrastructure-as-Code is code, so its bugs are security bugs:
# public S3 buckets, 0.0.0.0/0 security groups, unencrypted disks,
# containers running as root, missing resource limits.
# Scanning the DEFINITION (before apply) is far cheaper than finding the
# misconfiguration in production. Static only: no cloud credentials needed.

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "k8s/**"
      - "helm/**"
      - "Dockerfile*"
      - ".github/workflows/15-iac-scan.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"        # weekly: policy sets evolve

permissions:
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@REPLACE_WITH_FULL_COMMIT_SHA # v12.x - look up the SHA of the release tag, then pin it
        with:
          directory: .
          framework: terraform,kubernetes,helm,dockerfile,github_actions
          quiet: true                       # print failures only
          soft_fail: false                  # findings fail the job
          skip_check: ""                    # prefer inline, justified skips (see bottom)
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          download_external_modules: true   # scan remote Terraform modules too

      - name: Upload SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

  terraform-validate:
    # Cheap syntax/format gate BEFORE security scanning matters.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      - name: Validate (no backend, no credentials)
        run: |
          cd terraform
          terraform init -backend=false -input=false
          terraform validate

  trivy-config:
    # Second opinion with different rules; also covers Dockerfiles and K8s well.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
