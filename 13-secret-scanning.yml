name: Secret Scanning (Gitleaks)

# Detects committed credentials (API keys, tokens, private keys, passwords)
# BEFORE they merge. First security gate: cheapest, fastest, and the one
# where a miss is most damaging, because a leaked secret in git history is
# compromised forever, even if the file is later deleted.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"        # weekly full-history rescan (new detection rules)

permissions:
  contents: read
  security-events: write       # only to upload SARIF to the Security tab

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # scan the full history, not only the tip commit

      # Run the CLI directly: no licence key needed (the official action
      # requires one for organisation repos). Binary is checksum-verified.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep "linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # PRs: scan only the commits the PR adds (fast, and blames the author).
      # Other events: scan everything reachable.
      - name: Scan for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
            gitleaks detect --source . --log-opts="$RANGE" \
              --redact --verbose \
              --report-format sarif --report-path gitleaks.sarif
          else
            gitleaks detect --source . \
              --redact --verbose \
              --report-format sarif --report-path gitleaks.sarif
          fi

      - name: Upload SARIF to Security tab
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
