name: Matrix Testing

# Runs the same test job across several OS / python verion combinations
# One job definition expands into N parallel job, each on its own runner.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} on {{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
     fail-fast: false     # let every combination finish: a failure is one cell should not hide results from the other
     max-parallel: 6
     matrix:
      os: [ubuntu-latest, windows-latest, macos-latest]
      python-version: ["3.10", "3.11", "3.12"]
      exclude:
        - os: macos-latest    # example: skip an expensive/irrelevant cell
          python-version: "3.10"
      include:
        - os: ubuntu-latest   # example: add one extra cell with a custom flag
          python-version: "3.13"
          experimental: true
    continue-on-error: ${{ matrix.experimental == true }}   # experimental cell can't block the PR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/unit -q

  test-gate:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required matrix cell failed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix result: ${{ needs.test.result }}"
            exit 1
          fi